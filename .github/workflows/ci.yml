name: Build and smoke
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run smoke
      - run: npm run smoke:lifecycle
      - run: npm run smoke:sources
      - run: npm run smoke:integrations
      - run: npm run smoke:sdk
      - run: npm run smoke:portable
      - run: npm run smoke:access
      - run: npm run smoke:remote
      - run: npm run smoke:diff
      - run: npm run smoke:runner
      - run: npm run smoke:consistency
      - run: npm run build
