name: Report a reproducible problem
description: A context, integration, or workbench behavior did not match its contract.
labels: [bug]
body:
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Describe the action, expected behavior, and actual result. Use synthetic context; omit private histories and credentials.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Smallest reproduction
      description: Include commands or UI steps someone else can run with a fresh database.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Loomplane version or commit, Node version, and operating system
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: Relevant output
      description: Remove tokens, private paths, and proprietary context before sharing.
